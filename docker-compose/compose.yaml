---
services:
  plex:
    image: lscr.io/linuxserver/plex:1.41.8.9834-071366d65-ls269
    container_name: plex
    network_mode: host
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
      - VERSION=docker
      - PLEX_CLAIM=claim-eZWFBev5eytCFSsM6kiB
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /var/lib/plex/library:/config
      - /mediamounts/mercury:/mercury
      - /mediamounts/hermes:/hermes
      - /mediamounts/hecate:/hecate
    restart: unless-stopped

  signal-rest:
    image: bbernhard/signal-cli-rest-api:0.94
    restart: unless-stopped
    environment:
      - MODE=normal #supported modes: json-rpc, native, normal
      - AUTO_RECEIVE_SCHEDULE=0 22 * * * #enable this parameter on demand (see description below)
    ports:
      - "8080:8080" #map docker port 8080 to host port 8080.
    volumes:
      - "/home/alex/.local/share/signal-cli-config:/home/.local/share/signal-cli" #map "signal-cli-config" folder on host system into docker container. the folder contains the password and cryptographic keys when a new number is registered

  diun:
    image: crazymax/diun:4.30.0
    hostname: diun
    command: serve
    volumes:
      - "/home/alex/.local/share/diun:/data"
      - "/home/alex/.config/diun/diun.yaml:/diun.yml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - "TZ=Europe/Brussels"
      - "LOG_LEVEL=info"
      - "LOG_JSON=false"
    restart: always

  deluge:
      image: lscr.io/linuxserver/deluge:2.2.0-r0-ls326 
      container_name: deluge
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=Etc/UTC
        - DELUGE_LOGLEVEL=debug #optional
      volumes:
        - /home/alex/.config/deluge:/config
        - /mediamounts:/mediamounts
      ports:
        - 8112:8112
        - 6881:6881
        - 6881:6881/udp
        - 58846:58846 #optional
      restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=eyJhIjoiNmY5Y2UyOTljOTVhYTY3YzJiMDY5NjQ1NzdjYTE5NjQiLCJ0IjoiN2FkMzczNzEtZWRkZC00ZjYyLThiY2QtMDRhY2E0Njc1MWEwIiwicyI6Ik16bGxNemd3WTJRdFkySTRZUzAwWm1GaUxUZ3hPREF0TVdaalltVmtNbVExWkRKaiJ9

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      - "80:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
      - "443:443/tcp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
      #- "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
    environment:
      # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
      TZ: 'Europe/Brussels'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: 'Szymainska!1'
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'all'
      FTLCONF_dns_listeningMode: 'all'
    # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - './etc-pihole:/etc/pihole'
      # Uncomment the below if you have custom dnsmasq config files that you want to persist. Not needed for most starting fresh with Pi-hole v6. If you're upgrading from v5 you and have used this directory before, you should keep it enabled for the first v6 container start to allow for a complete migration. It can be removed afterwards. Needs environment variable FTLCONF_misc_etc_dnsmasq_d: 'true'
      #- './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.15.2941-ls285
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - /home/alex/.config/sonarr:/config
      - /mediamounts:/mediamounts
    ports:
      - 8989:8989
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:4.5.1-ls221
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - /home/alex/.config/sabnzbd:/config
      - /mediamounts:/mediamounts
    ports:
      - 8085:8080
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:1.38.0-nightly
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - /home/alex/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  overseerr:
    image: lscr.io/linuxserver/overseerr:v1.34.0-ls140
    container_name: overseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Brussels
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - /home/alex/.config/overseerr:/config
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:5.26.2.10099-ls276
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/alex/.config/radarr:/config
      - /mediamounts:/mediamounts
    ports:
      - 7878:7878
    restart: unless-stopped

