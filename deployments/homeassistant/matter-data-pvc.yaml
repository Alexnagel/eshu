apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-matter-data
  namespace: homeassistant
  annotations:
    # Matter fabric credentials — deleting this PVC means re-commissioning
    # every Matter device.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
