apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homeassistant-secure
  namespace: homeassistant
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ha.nagelkerke.net`)
      kind: Rule
      services:
        - name: homeassistant
          port: 8123
  tls:
    certResolver: cloudflare
