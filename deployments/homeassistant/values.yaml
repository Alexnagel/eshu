controllers:
  homeassistant:
    # SQLite recorder DB on a single PVC — never run two instances
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/home-assistant/home-assistant
          tag: "2026.10.3"
        env:
          TZ: Europe/Brussels
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8123
              initialDelaySeconds: 30
              periodSeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            # ZBT-2 Zigbee coordinator, provided (with device-cgroup access,
            # no privileged) by the generic-device-plugin DaemonSet. Appears
            # in the container at /dev/zigbee — point ZHA there.
            devic.es/zigbee: "1"
          limits:
            cpu: 2000m
            memory: 2Gi
            devic.es/zigbee: "1"

  # Matter controller server (matter.js based — successor of the archived
  # python-matter-server). HA's Matter integration connects to it at
  # ws://localhost:5580/ws (both pods use host networking).
  matter-server:
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/matter-js/matterjs-server
          tag: 1.4.0
        env:
          # Only the HA integration on this host needs to reach it
          LISTEN_ADDRESS: 127.0.0.1
        # No TCP probes: with the loopback-only bind, kubelet probes (which
        # dial the pod/host IP) can never connect. A crashed process exits
        # the container and gets restarted regardless.
        probes:
          readiness:
            enabled: false
          liveness:
            enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

defaultPodOptions:
  # Host networking so HA can do mDNS/SSDP discovery and reach IoT
  # devices on the LAN directly (the k8s pod network would hide them).
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

service:
  app:
    controller: homeassistant
    ports:
      http:
        port: 8123

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: local-path
    advancedMounts:
      homeassistant:
        app:
          - path: /config
  # Matter fabric credentials — losing this means re-commissioning
  # every Matter device. PVC is defined in matter-data-pvc.yaml as a raw
  # manifest: a second chart-templated PVC would rename the existing
  # `homeassistant` config claim (the chart only suffixes claim names
  # when it templates more than one).
  matter-data:
    type: persistentVolumeClaim
    existingClaim: homeassistant-matter-data
    advancedMounts:
      matter-server:
        app:
          - path: /data
