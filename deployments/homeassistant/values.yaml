controllers:
  homeassistant:
    # SQLite recorder DB on a single PVC — never run two instances
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/home-assistant/home-assistant
          tag: "2026.7.2"
        env:
          TZ: Europe/Brussels
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8123
              initialDelaySeconds: 30
              periodSeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi

defaultPodOptions:
  # Host networking so HA can do mDNS/SSDP discovery and reach IoT
  # devices on the LAN directly (the k8s pod network would hide them).
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

service:
  app:
    controller: homeassistant
    ports:
      http:
        port: 8123

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: local-path
    globalMounts:
      - path: /config
