apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: renovate-ui
  namespace: renovate
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`renovate.nagelkerke.net`)
      kind: Rule
      services:
        - name: renovate-operator-renovate-operator
          port: 8081
  tls:
    certResolver: cloudflare
