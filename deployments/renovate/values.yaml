# Renovate Operator Configuration
image:
  registry: ghcr.io
  repository: mogenius/renovate-operator
  tag: ""  # Uses chart appVersion if empty
  pullPolicy: IfNotPresent

# Operator configuration
config:
  # Delete successfully finished jobs (will lose logs)
  deleteSuccessfulJobs: false
  # TTL for finished jobs in seconds, -1 means kept forever
  jobTTLSecondsAfterFinished: -1
  # Default backoff limit for renovate jobs
  defaultJobBackoffLimit: 1
  # Default active deadline seconds for renovate jobs  
  defaultJobActiveDeadlineSeconds: 1800

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi
