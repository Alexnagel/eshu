# Renovate Operator Configuration
image:
  registry: ghcr.io
  repository: mogenius/renovate-operator
  tag: ""  # Uses chart appVersion if empty
  pullPolicy: IfNotPresent

# Ingress for the UI
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
  hosts:
    - host: renovate.nagelkerke.net
      paths:
        - path: /
          pathType: Prefix

# Operator configuration
config:
  # Delete successfully finished jobs (will lose logs)
  deleteSuccessfulJobs: false
  # TTL for finished jobs in seconds, -1 means kept forever
  jobTTLSecondsAfterFinished: -1
  # Default backoff limit for renovate jobs
  defaultJobBackoffLimit: 1
  # Default active deadline seconds for renovate jobs  
  defaultJobActiveDeadlineSeconds: 1800

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi
