apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: eshu-renovate
  namespace: renovate
spec:
  # Renovate only opens/updates PRs on weekends (see renovate.json5),
  # so run the job twice a day on Sat/Sun instead of every 4h all week.
  schedule: "0 6,18 * * 6,0"
  
  # Discover repositories in your GitHub account
  discoveryFilter: "alexnagel/*"
  
  # Renovate Docker image
  image: renovate/renovate:43.259.2
  
  # Run up to 3 renovate jobs concurrently
  parallelism: 3
  
  # Reference to secret containing GitHub credentials
  secretRef: renovate-github-app
  
  # GitHub platform configuration
  extraEnv:
    - name: RENOVATE_PLATFORM
      value: github
    - name: RENOVATE_ENDPOINT
      value: https://api.github.com/
    - name: RENOVATE_ONBOARDING
      value: "false"
    - name: RENOVATE_REQUIRE_CONFIG
      value: "optional"
    - name: RENOVATE_USERNAME
      value: "eshu-renovate[bot]"
    - name: RENOVATE_GIT_AUTHOR
      value: "eshu-renovate[bot] <eshu-renovate[bot]@users.noreply.github.com>"
    - name: GITHUB_APP_ID
      valueFrom:
        secretKeyRef:
          name: renovate-github-app
          key: appId
    - name: GITHUB_APP_INSTALLATION_ID
      valueFrom:
        secretKeyRef:
          name: renovate-github-app
          key: installationId
    - name: GITHUB_APP_PRIVATE_KEY
      valueFrom:
        secretKeyRef:
          name: renovate-github-app
          key: privateKey
  
  # Resource limits for renovate jobs
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
