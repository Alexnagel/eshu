apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: eshu-renovate
  namespace: renovate
spec:
  # Renovate only opens/updates PRs on weekends (see renovate.json5),
  # so run the job twice a day on Sat/Sun instead of every 4h all week.
  schedule: "0 6,18 * * 6,0"

  # Discover repositories in the GitHub account
  # (minimatch is case-sensitive — must match Alexnagel exactly)
  discoveryFilters:
    - "Alexnagel/*"

  # Renovate Docker image
  image: renovate/renovate:43.259.2

  # Run up to 3 renovate jobs concurrently
  parallelism: 3

  # Fills RENOVATE_PLATFORM / RENOVATE_ENDPOINT
  provider:
    name: github
    endpoint: https://api.github.com/

  # The operator generates RENOVATE_TOKEN from the GitHub App credentials
  githubAppReference:
    secretName: renovate-github-app
    appIdSecretKey: appId
    installationIdSecretKey: installationId
    pemSecretKey: privateKey

  extraEnv:
    - name: RENOVATE_ONBOARDING
      value: "false"
    - name: RENOVATE_REQUIRE_CONFIG
      value: "optional"
    - name: RENOVATE_USERNAME
      value: "eshu-renovate[bot]"
    - name: RENOVATE_GIT_AUTHOR
      value: "eshu-renovate[bot] <eshu-renovate[bot]@users.noreply.github.com>"

  # Resource limits for renovate jobs
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
