apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: eshu-renovate
  namespace: renovate
spec:
  # Renovate only opens/updates PRs on weekends (see renovate.json5),
  # so run the job twice a day on Sat/Sun instead of every 4h all week.
  schedule: "0 6,18 * * 6,0"

  # Discover repositories in the GitHub account
  # (minimatch is case-sensitive — must match Alexnagel exactly)
  discoveryFilters:
    - "Alexnagel/*"

  # Renovate Docker image
  image: renovate/renovate:44.30.3

  # Run up to 3 renovate jobs concurrently
  parallelism: 3

  # Fills RENOVATE_PLATFORM / RENOVATE_ENDPOINT. Omit `endpoint` for
  # github.com — the operator defaults to https://api.github.com and uses
  # the value verbatim (a trailing slash breaks its token URL with a 404).
  provider:
    name: github

  # The operator generates RENOVATE_TOKEN from the GitHub App credentials
  githubAppReference:
    secretName: renovate-github-app
    appIdSecretKey: appId
    installationIdSecretKey: installationId
    pemSecretKey: privateKey

  extraEnv:
    - name: RENOVATE_ONBOARDING
      value: "false"
    - name: RENOVATE_REQUIRE_CONFIG
      value: "optional"
    # Do NOT set RENOVATE_USERNAME / RENOVATE_GIT_AUTHOR here: with GitHub
    # App auth Renovate uses platform commits, where GitHub assigns the
    # canonical bot identity (257873871+eshu-renovate[bot]@users.noreply.
    # github.com). A mismatching manual gitAuthor makes Renovate treat its
    # own commits as foreign → every PR gets stuck as "edited/blocked".

  # Resource limits for renovate jobs
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
