# This file should NOT be committed to git
# Create the secret manually with:
# kubectl create secret generic renovate-github-token \
#   --from-literal=token=ghp_YOUR_TOKEN_HERE \
#   -n renovate
#
# Or apply this file after replacing YOUR_GITHUB_TOKEN_BASE64:
# echo -n "ghp_your_token" | base64
apiVersion: v1
kind: Secret
metadata:
  name: renovate-github-token
  namespace: renovate
type: Opaque
data:
  token: YOUR_GITHUB_TOKEN_BASE64
