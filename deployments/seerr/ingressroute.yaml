apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seerr-secure
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`seer.nagelkerke.net`)
      kind: Rule
      services:
        - name: seerr
          port: 5055
  tls:
    certResolver: cloudflare
