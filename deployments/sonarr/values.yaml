controllers:
  sonarr:
    # SQLite config on a hostPath — never run two instances
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/linuxserver/sonarr
          tag: 4.0.20.3014-ls329
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Brussels
        # linuxserver images start as root (s6) and drop to PUID/PGID
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          readOnlyRootFilesystem: false
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: eshu

service:
  app:
    controller: sonarr
    ports:
      http:
        port: 8989

persistence:
  config:
    type: hostPath
    hostPath: /home/alex/.config/sonarr
    globalMounts:
      - path: /config
  mediamounts:
    type: hostPath
    hostPath: /mediamounts
    globalMounts:
      - path: /mediamounts
