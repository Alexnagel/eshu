# Advertises host devices as allocatable Kubernetes resources so pods can
# use them WITHOUT running privileged. Here: the Nabu Casa ZBT-2 Zigbee
# coordinator, exposed as `devic.es/zigbee`, which Home Assistant requests.
# (devic.es is the plugin's default resource domain.)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: "Exists"
          effect: "NoExecute"
        - operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: generic-device-plugin
          # renovate: datasource=docker depName=squat/generic-device-plugin
          image: docker.io/squat/generic-device-plugin:latest@sha256:5c48f7a16cfb37c4e07731bfa384b9dba6e12d2b0fb4350d8a321d49f12ac494
          args:
            - --device
            - |
              name: zigbee
              groups:
                - paths:
                    - path: /dev/serial/by-id/usb-Nabu_Casa_ZBT-2_A4CB8FD2C054-if00
                      mountPath: /dev/zigbee
          resources:
            requests:
              cpu: 50m
              memory: 10Mi
            limits:
              cpu: 50m
              memory: 20Mi
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
