deployment:
  replicas: 1
  initContainers:
    - name: volume-permissions
      image: busybox:latest
      command: ["sh", "-c", "touch /data/acme.json; chmod -v 600 /data/acme.json"]
      volumeMounts:
      - mountPath: /data
        name: data

podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: "OnRootMismatch"

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.1.243"

ports:
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80
  websecure:
    port: 443
    expose:
      default: true
    exposedPort: 443
    http3:
      enabled: true
    tls:
      enabled: true

ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - websecure
    matchRule: Host(`traefik.nagelkerke.net`)
    tls:
      certResolver: transip

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
    publishedService:
      enabled: true

globalArguments:
  - "--global.checknewversion"

additionalArguments:
  - "--certificatesresolvers.transip.acme.email=admin@nagelkerke.net"
  - "--certificatesresolvers.transip.acme.dnschallenge.provider=transip"
  - "--certificatesresolvers.transip.acme.dnschallenge.delaybeforecheck=120"
  - "--certificatesresolvers.transip.acme.storage=/data/acme.json"
  - "--providers.kubernetescrd.namespaces="

env:
  - name: TRANSIP_ACCOUNT_NAME
    value: brocos
  - name: TRANSIP_PRIVATE_KEY_PATH
    value: /transip/transip.key

volumes:
  - name: transip-key
    mountPath: "/transip"
    type: secret

persistence:
  enabled: true
  name: data
  size: 128Mi
  path: /data
  storageClass: local-path

logs:
  general:
    level: INFO
  access:
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
