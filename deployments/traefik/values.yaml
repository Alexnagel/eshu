deployment:
  replicas: 1
  initContainers:
    - name: volume-permissions
      image: busybox:latest
      command: ["sh", "-c", "touch /data/acme.json; chmod -v 600 /data/acme.json"]
      volumeMounts:
      - mountPath: /data
        name: data

podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: "OnRootMismatch"

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.0.243"

ports:
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80
    # Redirect all plain HTTP to HTTPS at the entrypoint so individual
    # services don't need their own redirect middleware/IngressRoute.
    redirectTo:
      port: websecure
  websecure:
    port: 443
    expose:
      default: true
    exposedPort: 443
    http3:
      enabled: true
    tls:
      enabled: true

ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - websecure
    matchRule: Host(`traefik.nagelkerke.net`)
    tls:
      certResolver: cloudflare

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
    publishedService:
      enabled: true

globalArguments:
  - "--global.checknewversion"

additionalArguments:
  - "--certificatesresolvers.cloudflare.acme.email=admin@nagelkerke.net"
  - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
  - "--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=30"
  - "--certificatesresolvers.cloudflare.acme.storage=/data/acme.json"
  - "--providers.kubernetescrd.namespaces="

env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: token

persistence:
  enabled: true
  name: data
  size: 128Mi
  path: /data
  storageClass: local-path

logs:
  general:
    level: INFO
  access:
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
