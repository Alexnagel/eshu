deployment:
  replicas: 1
  initContainers:
    - name: volume-permissions
      image: busybox:latest
      command: ["sh", "-c", "touch /data/acme.json; chmod -v 600 /data/acme.json"]
      volumeMounts:
      - mountPath: /data
        name: data

podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: "OnRootMismatch"

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.0.243"

ports:
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80
    # Redirect all plain HTTP to HTTPS at the entrypoint so individual
    # services don't need their own redirect middleware/IngressRoute.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 443
    expose:
      default: true
    exposedPort: 443
    http3:
      enabled: true
    # TLS on websecure is enabled by default in this chart version
    # (ports.websecure.http.tls)

ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - websecure
    matchRule: Host(`traefik.nagelkerke.net`)
    tls:
      certResolver: cloudflare

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
    publishedService:
      enabled: true

# ACME via Cloudflare DNS-01 — structured config replaces the old
# --certificatesresolvers.* additionalArguments
certificatesResolvers:
  cloudflare:
    acme:
      email: admin@nagelkerke.net
      storage: /data/acme.json
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 30

env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: token

persistence:
  enabled: true
  name: data
  size: 128Mi
  path: /data
  storageClass: local-path

log:
  level: INFO

accessLog:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
