apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr-secure
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`radarr.nagelkerke.net`)
      kind: Rule
      services:
        - name: radarr
          port: 7878
  tls:
    certResolver: cloudflare
