apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich-secure
  namespace: immich
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`immich.nagelkerke.net`)
      kind: Rule
      services:
        - name: immich-server
          port: 2283
  tls:
    certResolver: cloudflare
