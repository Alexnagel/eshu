apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sabnzbd-secure
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sabnzbd.nagelkerke.net`)
      kind: Rule
      services:
        - name: sabnzbd
          port: 8080
  tls:
    certResolver: cloudflare
