serviceDns:
  annotations:
    metallb.universe.tf/allow-shared-ip: pihole-svc
  type: LoadBalancer
  loadBalancerIP: "192.168.1.240"

serviceWeb:
  annotations:
    metallb.universe.tf/allow-shared-ip: pihole-svc
  type: LoadBalancer
  loadBalancerIP: "192.168.1.240"
  http:
    enabled: true
    port: 80
  https:
    enabled: false

ingress:
  enabled: false

extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: pihole-secure
      namespace: pihole
    spec:
      entryPoints:
        - websecure
      routes:
        - match: Host(`pihole.nagelkerke.net`)
          kind: Rule
          services:
            - name: pihole-web
              port: 80
      tls:
        certResolver: transip

persistentVolumeClaim:
  enabled: true
  size: 500Mi

admin:
  existingSecret: "pihole-password"
  passwordKey: "password"

DNS1: "8.8.8.8"
DNS2: "8.8.4.4"

dnsmasq:
  customDnsEntries:
    - address=/plex.nagelkerke.net/192.168.1.243
    - address=/pihole.nagelkerke.net/192.168.1.243
    - address=/traefik.nagelkerke.net/192.168.1.243

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
