serviceDns:
  annotations:
    metallb.universe.tf/allow-shared-ip: pihole-svc
    metallb.universe.tf/loadBalancerIPs: "192.168.0.240"
  type: LoadBalancer

serviceWeb:
  annotations:
    metallb.universe.tf/allow-shared-ip: pihole-svc
    metallb.universe.tf/loadBalancerIPs: "192.168.0.240"
  type: LoadBalancer
  http:
    enabled: true
    port: 80
  https:
    enabled: false

ingress:
  enabled: false

persistentVolumeClaim:
  enabled: true
  size: 500Mi

admin:
  existingSecret: "pihole-password"
  passwordKey: "password"

DNS1: "8.8.8.8"
DNS2: "8.8.4.4"

extraVolumeMounts:
  custom-dnsmasq:
    mountPath: /etc/dnsmasq.d/02-custom.conf
    subPath: 02-custom.conf

extraVolumes:
  custom-dnsmasq:
    configMap:
      name: pihole-custom-dnsmasq

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
