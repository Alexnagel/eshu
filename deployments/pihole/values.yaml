serviceDns:
  annotations:
    metallb.universe.tf/allow-shared-ip: pihole-svc
    metallb.universe.tf/loadBalancerIPs: "192.168.0.240"
  type: LoadBalancer

serviceWeb:
  annotations:
    metallb.universe.tf/allow-shared-ip: pihole-svc
    metallb.universe.tf/loadBalancerIPs: "192.168.0.240"
  type: LoadBalancer
  http:
    enabled: true
    port: 80
  https:
    enabled: false

ingress:
  enabled: false

persistentVolumeClaim:
  enabled: true
  size: 500Mi

admin:
  existingSecret: "pihole-password"
  passwordKey: "password"

DNS1: "8.8.8.8"
DNS2: "8.8.4.4"

# Local DNS records for the homelab, served by the chart's own
# custom-dnsmasq ConfigMap (do not hand-roll a ConfigMap of that name).
dnsmasq:
  customDnsEntries:
    - address=/plex.nagelkerke.net/192.168.0.243
    - address=/pihole.nagelkerke.net/192.168.0.243
    - address=/traefik.nagelkerke.net/192.168.0.243
    - address=/argocd.nagelkerke.net/192.168.0.243
    - address=/renovate.nagelkerke.net/192.168.0.243
    - address=/sonarr.nagelkerke.net/192.168.0.243
    - address=/radarr.nagelkerke.net/192.168.0.243
    - address=/sabnzbd.nagelkerke.net/192.168.0.243
    # Local-only aliases for the publicly exposed apps (the public names
    # seerr/immich resolve via Cloudflare everywhere, incl. on the LAN —
    # no split horizon)
    - address=/seer.nagelkerke.net/192.168.0.243
    - address=/immichk8s.nagelkerke.net/192.168.0.243
    # Omada controller (OC200)
    - address=/omada.nagelkerke.net/192.168.0.9

resources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 1Gi
