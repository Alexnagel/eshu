apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pihole-redirect
  namespace: pihole
spec:
  redirectRegex:
    regex: ^https://([^/]+)/?$
    replacement: https://${1}/admin
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole-secure
  namespace: pihole
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pihole.nagelkerke.net`)
      kind: Rule
      middlewares:
        - name: pihole-redirect
      services:
        - name: pihole-web
          port: 80
  tls:
    certResolver: cloudflare
