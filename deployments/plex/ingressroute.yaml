apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: plex
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: plex-redirect
  namespace: plex
spec:
  redirectRegex:
    regex: ^https://([^/]+)/?$
    replacement: https://${1}/web
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plex-http
  namespace: plex
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`plex.nagelkerke.net`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: plex-plex-media-server
          port: 32400
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plex-secure
  namespace: plex
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`plex.nagelkerke.net`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: plex-redirect
      services:
        - name: plex-plex-media-server
          port: 32400
  tls:
    certResolver: cloudflare
