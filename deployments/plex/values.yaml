image:
  tag: 1.43.2.10687-563d026ea

service:
  type: LoadBalancer
  port: 32400
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.0.242"
  # Preserve the client source IP. With the default (Cluster) every client
  # is SNAT'd to the CNI gateway (10.42.0.1), so Plex can't match them
  # against its LAN networks (192.168.0.0/24) and treats ALL clients as
  # remote — applying internet bitrate caps and forcing transcodes.
  externalTrafficPolicy: Local

ingress:
  enabled: false

extraVolumes:
  - name: hecate
    hostPath:
      path: /mediamounts/hecate
      type: Directory
  - name: mercury
    hostPath:
      path: /mediamounts/mercury
      type: Directory
  - name: hermes
    hostPath:
      path: /mediamounts/hermes
      type: Directory

# Mount media at the same paths as the docker-compose setup so an existing
# Plex library config (which references these paths) migrates unchanged.
extraVolumeMounts:
  - name: hecate
    mountPath: /hecate
  - name: mercury
    mountPath: /mercury
  - name: hermes
    mountPath: /hermes

persistence:
  config:
    enabled: true
    size: 20Gi
    storageClass: local-path

runtimeClassName: nvidia

pms:
  gpu:
    nvidia:
      enabled: true
      devices: "all"
      capabilities: "compute,video,utility"
  resources:
    limits:
      cpu: 4000m
      # NO memory limit — deliberate, matching the docker-compose setup.
      # In cgroup v2 the page cache from reading media counts toward
      # memory.max, so streaming a 60-100GB 4K remux fills the cgroup fast.
      # With a 4Gi cap it hit the ceiling 289 times: the kernel then reclaims
      # the very buffers Plex is streaming from, thrashing I/O until the
      # client times out ("playback error") — no OOM kill, no pod restart,
      # which is why it looked like a network problem. Page cache is
      # reclaimable node-wide, so leaving this unbounded is safe here.
      nvidia.com/gpu: 1
      # Caps the chart's unbounded /transcode emptyDir (counts against
      # pod ephemeral storage) so a transcode spike can't fill the node
      # and evict other pods — only Plex itself gets evicted at the cap.
      ephemeral-storage: 25Gi
    requests:
      cpu: 1000m
      # Reserved for scheduling; actual usage may exceed this (Burstable).
      memory: 3Gi
      nvidia.com/gpu: 1
      ephemeral-storage: 1Gi

env:
  TZ: "Europe/Amsterdam"
  # PLEX_CLAIM is only needed for the initial one-time server claim.
  # The server is already claimed, so it is intentionally omitted here.
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: all

nodeSelector:
  kubernetes.io/hostname: eshu
