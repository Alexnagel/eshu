image:
  tag: latest

service:
  type: LoadBalancer
  port: 32400
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.1.242"

extraVolumes:
  - name: hecate
    hostPath:
      path: /mediamounts/hecate
      type: Directory
  - name: mercury
    hostPath:
      path: /mediamounts/mercury
      type: Directory
  - name: hermes
    hostPath:
      path: /mediamounts/hermes
      type: Directory

extraVolumeMounts:
  - name: hecate
    mountPath: /data/hecate
  - name: mercury
    mountPath: /data/mercury
  - name: hermes
    mountPath: /data/hermes

persistence:
  config:
    enabled: true
    size: 20Gi
    storageClass: local-path

env:
  TZ: "Europe/Amsterdam"
  PLEX_CLAIM: "***REMOVED-PLEX-CLAIM***"
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: all

resources:
  limits:
    cpu: 4000m
    memory: 4Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 1000m
    memory: 2Gi
    nvidia.com/gpu: 1

nodeSelector:
  kubernetes.io/hostname: eshu
