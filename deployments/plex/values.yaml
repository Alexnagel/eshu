image:
  tag: 1.43.2.10687-563d026ea

service:
  type: LoadBalancer
  port: 32400
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.0.242"

ingress:
  enabled: false

extraVolumes:
  - name: hecate
    hostPath:
      path: /mediamounts/hecate
      type: Directory
  - name: mercury
    hostPath:
      path: /mediamounts/mercury
      type: Directory
  - name: hermes
    hostPath:
      path: /mediamounts/hermes
      type: Directory
  - name: transcode
    emptyDir:
      sizeLimit: 20Gi

extraVolumeMounts:
  - name: hecate
    mountPath: /data/hecate
  - name: mercury
    mountPath: /data/mercury
  - name: hermes
    mountPath: /data/hermes
  - name: transcode
    mountPath: /transcode

persistence:
  config:
    enabled: true
    size: 20Gi
    storageClass: local-path

runtimeClassName: nvidia

pms:
  gpu:
    nvidia:
      enabled: true
      devices: "all"
      capabilities: "compute,video,utility"
  resources:
    limits:
      cpu: 4000m
      memory: 4Gi
      nvidia.com/gpu: 1
    requests:
      cpu: 1000m
      memory: 2Gi
      nvidia.com/gpu: 1

env:
  TZ: "Europe/Amsterdam"
  # PLEX_CLAIM is only needed for the initial one-time server claim.
  # The server is already claimed, so it is intentionally omitted here.
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: all

nodeSelector:
  kubernetes.io/hostname: eshu
