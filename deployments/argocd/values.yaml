nameOverride: argocd

global:
  domain: argocd.nagelkerke.net

configs:
  params:
    server.insecure: true
  cm:
    # Make the app-of-apps consider child Application health so that
    # sync-wave ordering between child apps is actually respected.
    resource.customizations: |
      argoproj.io/Application:
        health.lua: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.health ~= nil then
              hs.status = obj.status.health.status
              if obj.status.health.message ~= nil then
                hs.message = obj.status.health.message
              end
            end
          end
          return hs

server:
  service:
    type: ClusterIP
