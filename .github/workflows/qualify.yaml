name: Qualify

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  validate:
    name: Qualify
    runs-on: ubuntu-latest
    outputs:
      yamls-changed: ${{ steps.changed-yaml-files.outputs.any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: renovate.json5

      - name: Get changed yaml files
        id: changed-yaml-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            applications/**/*.yaml
            deployments/**/*.yaml
            app-of-apps.yaml

      - name: Validate renovate config
        if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
        uses: suzuki-shunsuke/github-action-renovate-config-validator@v2.0.0
        with:
            config_file_path: renovate.json5

  render:
    name: Render charts & validate manifests
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' && needs.validate.outputs.yamls-changed == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          path: pull-request
          persist-credentials: false

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: main
          persist-credentials: false

      # helm and yq are preinstalled on ubuntu runners
      - name: Install kubeconform
        uses: bmuschko/setup-kubeconform@v1
        with:
          # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.*)$
          kubeconform-version: '0.7.0'

      - name: Render PR charts with pinned versions and repo values, then validate
        run: ./pull-request/scripts/validate-manifests.sh pull-request rendered/pull-request

      - name: Render main charts
        run: RENDER_ONLY=1 ./pull-request/scripts/validate-manifests.sh main rendered/main

      - name: Generate diff
        run: |
          ./pull-request/scripts/diff-manifests.sh rendered/main rendered/pull-request diff.md
          cat diff.md

      - name: Post diff as PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} \
            --body-file diff.md --edit-last || \
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} \
            --body-file diff.md
