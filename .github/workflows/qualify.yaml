name: Qualify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Qualify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: renovate.json5

      - name: Validate renovate config
        if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
        uses: suzuki-shunsuke/github-action-renovate-config-validator@v2.0.0
        with:
            config_file_path: renovate.json5

  render:
    name: Render charts & validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
            persist-credentials: false

      # helm and yq are preinstalled on ubuntu runners
      - name: Install kubeconform
        uses: bmuschko/setup-kubeconform@v1
        with:
          # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.*)$
          kubeconform-version: '0.7.0'

      - name: Render all charts with pinned versions and repo values
        run: ./scripts/validate-manifests.sh

  diff-preview:
    name: Argo CD diff preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # renovate: datasource=docker depName=dagandersen/argocd-diff-preview
      DIFF_PREVIEW_VERSION: v0.2.11
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          path: pull-request
          persist-credentials: false

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Prepare secrets
        run: |
          mkdir secrets
          cat > secrets/secret.yaml << "EOF"
          apiVersion: v1
          kind: Secret
          metadata:
            name: private-repo
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repo-creds
          stringData:
            url: https://github.com/${{ github.repository }}
            password: ${{ secrets.GITHUB_TOKEN }}  ⬅️ Short-lived GitHub Token
            username: not-used
          EOF

      - name: Generate diff
        run: |
          docker run \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)/main":/base-branch \
            -v "$(pwd)/pull-request":/target-branch \
            -v "$(pwd)/output":/output \
            -v $(pwd)/secrets:/secrets \
            -e TARGET_BRANCH=refs/pull/${{ github.event.number }}/merge \
            -e REPO=${{ github.repository }} \
            dagandersen/argocd-diff-preview:${DIFF_PREVIEW_VERSION}

      - name: Post diff as PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} \
            --body-file output/diff.md --edit-last || \
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} \
            --body-file output/diff.md
