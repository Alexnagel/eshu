apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://helm.mogenius.com/public
      chart: renovate-operator
      targetRevision: 5.2.0
      helm:
        releaseName: renovate-operator
        valueFiles:
          - $values/deployments/renovate/values.yaml
    - repoURL: https://github.com/Alexnagel/eshu.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Alexnagel/eshu.git
      targetRevision: main
      path: deployments/renovate
  
  destination:
    server: https://kubernetes.default.svc
    namespace: renovate
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
