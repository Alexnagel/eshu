apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plex
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages
      chart: plex-media-server
      targetRevision: 1.9.0
      helm:
        releaseName: plex
        valueFiles:
          - $values/deployments/plex/values.yaml
    - repoURL: https://github.com/Alexnagel/eshu.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Alexnagel/eshu.git
      targetRevision: main
      path: deployments/plex
  
  destination:
    server: https://kubernetes.default.svc
    namespace: plex
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
