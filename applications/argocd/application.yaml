apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.11.1
      helm:
        releaseName: argocd
        valueFiles:
          - $values/deployments/argocd/values.yaml
    - repoURL: https://github.com/Alexnagel/eshu.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Alexnagel/eshu.git
      targetRevision: main
      path: deployments/argocd
  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
